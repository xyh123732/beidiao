
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贝雕数字展示平台</title>

    <!-- 引入网页样式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>贝雕数字展示平台</h1>
        <p>让传统工艺被看见，让非遗文化被传承</p>
    </header>

    <main class="container">
        <section class="intro">
            <h2>探索贝雕艺术</h2>
            <p>在这里认识贝雕作品、了解传统工艺与文化故事。</p>
        </section>

        <section class="toolbar">
            <input
                type="text"
                id="searchInput"
                placeholder="搜索作品名称或关键词……"
            >

            <select id="categorySelect">
                <option value="全部">全部类别</option>
                <option value="花鸟">花鸟</option>
                <option value="山水">山水</option>
                <option value="人物">人物</option>
            </select>
        </section>

        <section>
            <h2>作品展示</h2>
            <div id="artworkList" class="artwork-list"></div>
            <p id="emptyMessage" class="empty-message" hidden>
                没有找到相关作品，请尝试其他关键词。
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>贝雕数字展示平台 · 非遗文化数字展示原型</p>
    </footer>

    <!-- 作品详情弹窗 -->
    <dialog id="detailDialog">
        <button id="closeDialog" class="close-button">关闭 ✕</button>
        <div id="detailContent"></div>
    </dialog>

    <!-- 引入网页交互逻辑 -->
    <script src="script.js"></script>

</body>
</html>
